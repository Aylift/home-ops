services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homeops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homeops}
      POSTGRES_DB: ${POSTGRES_DB:-homeops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homeops} -d ${POSTGRES_DB:-homeops}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not exposed to the host — only reachable from the backend service.

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-homeops}:${POSTGRES_PASSWORD:-homeops}@db:5432/${POSTGRES_DB:-homeops}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
