services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homeops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homeops}
      POSTGRES_DB: ${POSTGRES_DB:-homeops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homeops} -d ${POSTGRES_DB:-homeops}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not exposed to the host — only reachable from the backend service.

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-homeops}:${POSTGRES_PASSWORD:-homeops}@db:5432/${POSTGRES_DB:-homeops}
      # Weather (backend is the single weather authority). Values come from the
      # repo-root .env; weather stays disabled unless WEATHER_ENABLED=true.
      WEATHER_ENABLED: ${WEATHER_ENABLED:-false}
      OWM_API_KEY: ${OWM_API_KEY:-}
      OWM_LAT: ${OWM_LAT:-}
      OWM_LON: ${OWM_LON:-}
      WEATHER_CACHE_TTL: ${WEATHER_CACHE_TTL:-600}
      WEATHER_MAX_STALE: ${WEATHER_MAX_STALE:-21600}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
